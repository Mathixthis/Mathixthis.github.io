<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Démo · Nextround</title>
  <link rel="icon" href="../logo.svg">
  <link rel="stylesheet" href="coach.css">
  <style>
    body { max-width: 760px; margin: 0 auto; }
    .boutons { display: grid; gap: 8px; }
    button {
      background: var(--carte); color: var(--texte); border: 1px solid var(--bordure);
      border-radius: 8px; padding: 12px; font: inherit; text-align: left; cursor: pointer;
    }
    button:hover { border-color: var(--rouge); }
    .choix-agent { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    select { background: var(--carte); color: var(--texte); border: 1px solid var(--bordure); border-radius: 8px; padding: 8px; font: inherit; }
    .info { background: var(--carte); border: 1px solid var(--bordure); border-left: 4px solid var(--jaune); border-radius: 10px; padding: 12px 14px; font-size: 14px; color: #cfcac2; }
    a { color: var(--rouge); }
  </style>
</head>
<body>
  <header class="entete"><a class="logo" href="../" style="text-decoration:none;color:inherit"><span>NEXT</span>ROUND</a><div class="partie">Démo en ligne</div></header>
  <p class="info">Dans l’appli, Nextround reçoit les données de ta vraie partie via Overwolf. Ici, choisis un type de joueur : une fausse partie est générée, analysée exactement comme une vraie, puis le récap s’ouvre.</p>
  <label class="choix-agent">Agent joué <select id="agent"></select></label>
  <div class="boutons" id="boutons"></div>
  <p class="partie"><a href="../">← Retour à l’accueil</a></p>
  <script src="moteur.min.js"></script>
  <script src="simulateur.min.js"></script>
</body>
</html>
